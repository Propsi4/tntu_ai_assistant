[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

known_pandas = "pandas,numpy"
sections = "FUTURE,STDLIB,THIRDPARTY,PANDAS,FIRSTPARTY,LOCALFOLDER"

import_heading_stdlib = "Standart library imports"
import_heading_thirdparty = "Thirdparty imports"
import_heading_firstparty = "Local imports"
import_heading_localfolder = "Local folder imports"

[tool.poetry]
name = "TNTU AI Agent"
readme = "README.md"
version = "1.0.0"
description = "TNTU AI Agent"
authors = [
    "Vadym Burylo <gaenday12@gmail.com>",
]
packages = [
    { include = "ml" },
    { include = "ui" }
]

[tool.poetry.dependencies]
python = ">=3.11.11,<3.12"
python-dotenv = "^1.2.1"
pydantic-settings = "^2.12.0"

[tool.poetry.group.ml.dependencies]
fastapi = "^0.124.0"
langchain-core = "^1.1.1"
dspy = "^3.0.4"
tavily-python = "^0.7.14"
langchain-openai = "^1.1.0"
pgvector = "^0.4.2"
playwright = "^1.56.0"
beautifulsoup4 = "^4.14.3"
markdownify = "^1.2.2"
pypdf = "^6.4.0"
python-docx = "^1.2.0"
python-pptx = "^1.0.2"
langchain-text-splitters = "^1.0.0"
python-multipart = "^0.0.20"
uvicorn = "^0.38.0"
psycopg2-binary = "^2.9.11"
asyncpg = "^0.31.0"

[tool.poetry.group.ui.dependencies]
streamlit = "^1.52.1"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
flake8 = "^7.1.1"
flake8-docstrings = "^1.7.0"
mypy = "^1.13.0"
poetry = "^2.1.3"
pre-commit = "^4.0.1"
ipykernel = "^6.29.5"
pytest = "^8.4.2"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
api = "ml.main:main"
ui = "ui.main:run_ui"