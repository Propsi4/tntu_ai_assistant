services:
  ml:
    container_name: tntuassistant-ml
    build:
      context: .
      dockerfile: Dockerfile.ml
    networks:
      - internal
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
    - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    container_name: tntuassistant-ui
    build:
      context: .
      dockerfile: Dockerfile.ui
    networks:
      - internal
    env_file:
      - .env
    ports:
      - "8500:8500"
    depends_on:
      ml:
        condition: service_healthy

networks:
  internal:

